
name: Python Application CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          python -m pip install -e ./prime_checker
      - name: Check Python code quality
        run: python -m flake8 prime_checker/ user_registration/ unit_testing_simple/ unit_testing_best_practice/    

      - name: Test user registration
        working-directory: ./user_registration
        run: python -m pytest -v

      - name: Test prime checker
        working-directory: ./prime_checker
        run: python -m pytest -v
